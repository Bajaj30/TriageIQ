services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg16      # pinned: Postgres 16 + pgvector, never "latest"
    container_name: triageiq-postgres
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"        # host 5433 -> container 5432 (5432 on the Mac is Postgres.app)
    volumes:
      - pgdata:/var/lib/postgresql/data      # named volume: data survives container restarts/removal
      - ./Data:/import:ro                    # the CSV, read-only, visible to COPY inside the container
    shm_size: 1gb                            # room for large sorts / window functions
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
