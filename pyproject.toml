[project]
name = "triageiq"
version = "0.1.0"
description = "Customer support ticket escalation prediction system"
authors = [
    {name = "Shivam Bajaj"}
]
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pandas (>=2.0,<3)",
    "numpy (>=1.24,<2)",
    "pyarrow (>=25.0.1,<26.0.0)",
    "ipykernel (>=7.3.0,<8.0.0)",
    "langdetect (>=1.0.9,<2.0.0)",
    "matplotlib (>=3.11.1,<4.0.0)",
    "anthropic (>=1.5.0,<2.0.0)",
    "python-dotenv (>=1.2.3,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
