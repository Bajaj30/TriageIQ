# NGINX — the receptionist in front of the API (a "reverse proxy").
# Visitors knock on port 80 (later 443 for HTTPS); NGINX walks them to the api container on the private
# Docker network. Why a receptionist instead of opening the api's own door:
#   - one public door only: the api (8000) and the database (5432) are never exposed to the internet
#   - per-visitor limits: one person can't flood the 2 GB server with requests
#   - the place where HTTPS and the frontend pages will plug in later
# This file is included inside NGINX's `http { }` block (the official image loads conf.d/*.conf there).

limit_req_zone $binary_remote_addr zone=per_ip:10m rate=5r/s;   # ~5 requests a second per visitor IP
limit_req_status 429;                                             # over the limit -> "429 Too Many Requests"

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;                 # don't advertise the NGINX version
    client_max_body_size 64k;          # a complaint is at most 20,000 characters

    location / {
        limit_req zone=per_ip burst=20 nodelay;      # short bursts are fine (Swagger loads several files)
        proxy_pass http://api:8000;                  # the api's service name on the private network
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
