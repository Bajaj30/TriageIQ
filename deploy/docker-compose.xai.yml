# ============================================================
# deploy/docker-compose.xai.yml — LOCAL ONLY: switch on the "Why this score?" explanations (api/xai.py).
#     docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.xai.yml up -d --build
# A second file layered on top of the first: Compose merges them, so this adds only what differs — the three
# explanation files, mounted read-only into the api container next to the model. Without them the explain
# endpoints stay hidden. The AWS server never uses this file: an explanation re-reads the complaint up to ~250
# times, which its two small CPU cores can't do while scoring everyone else (README section 8).
# Files: sh deploy/get_model.sh downloads them (or training/serving/export_xai_onnx.py builds them).
# ============================================================
services:
  api:
    environment:
      XAI_THREADS: "4"                        # CPU threads for an explanation
    volumes:
      - ../training/outputs/serving_v3/xai_encoder.onnx:/app/model/xai_encoder.onnx:ro
      - ../training/outputs/serving_v3/xai_head.onnx:/app/model/xai_head.onnx:ro
      - ../training/outputs/serving_v3/xai_background.npz:/app/model/xai_background.npz:ro
